[package]
name = "typst-diff"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# IMPORTANT NOTE ON VERSIONS
# --------------------------
# Typst's internal crates (typst, typst-library, typst-eval, typst-syntax,
# typst-layout, typst-pdf, typst-kit) MUST all be on the SAME version, since
# they are not guaranteed to be compatible across different versions (they
# are "implementation" crates, not a stable public API).
#
# Check the latest published version here before building:
#   https://crates.io/crates/typst
# and replace "0.15" below with the exact version found (e.g. "0.15.1").

[dependencies]
typst = "0.15"
typst-eval = "0.15"
typst-layout = "0.15"
typst-syntax = "0.15"
typst-pdf = "0.15"

comemo = "0.5"
ecow = "0.2"
similar = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# "embedded-fonts"/"scan-fonts" back FontStore's two font sources (see
# world.rs): the ones bundled with the compiler, and ones discovered under
# --font-path. Package loading (see world.rs's `realize`) only needs
# `packages::FsPackages`, which isn't behind a feature flag.
typst-kit = { version = "0.15", features = ["embedded-fonts", "scan-fonts"] }
# Reads git objects directly (no checkout) for `typst-diff git`'s
# --old-rev/--new-rev -- see world.rs's `Backend::Git`. "revision" backs
# `Repository::rev_parse_single`, which resolves a tag, branch, or commit
# the same way `git rev-parse` does. Pure Rust (no libgit2/openssl), unlike
# `git2`, keeping this dependency-light and friendly to static musl builds.
gix = { version = "0.87", default-features = false, features = ["revision", "sha1"] }

[profile.release]
opt-level = 3
