[package]
name = "typst-diff"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# IMPORTANT NOTE ON VERSIONS
# --------------------------
# Typst's internal crates (typst, typst-library, typst-eval, typst-syntax,
# typst-layout, typst-pdf, typst-assets) MUST all be on the SAME version,
# since they are not guaranteed to be compatible across different versions
# (they are "implementation" crates, not a stable public API).
#
# Check the latest published version here before building:
#   https://crates.io/crates/typst
# and replace "0.15" below with the exact version found (e.g. "0.15.1").

[dependencies]
typst = "0.15"
typst-eval = "0.15"
typst-layout = "0.15"
typst-syntax = "0.15"
typst-pdf = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }

comemo = "0.5"
ecow = "0.2"
similar = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
